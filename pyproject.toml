[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bayesian-mixture-transport-signatures"
version = "0.1.0"
description = "Notebook-first examples and core routines for Bayesian mixture transport signatures"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Kisung You"},
]
license = {text = "MIT"}
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "scikit-learn>=1.3",
  "pandas>=2.0",
]

[project.optional-dependencies]
notebooks = [
  "jupyterlab>=4.0",
  "ipykernel>=6.25",
  "nbclient>=0.8",
  "nbformat>=5.9",
]

[tool.setuptools]
py-modules = ["bmts"]
